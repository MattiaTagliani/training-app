services:
  postgres:
    image: postgres:17
    container_name: training-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: training_app
      POSTGRES_USER: training_app
      POSTGRES_PASSWORD: training_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: training-app-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
